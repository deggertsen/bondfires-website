name: App association files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test association tooling
        run: node --test scripts/app-links.test.mjs
      - name: Reject placeholders and invalid production associations
        run: node scripts/validate-app-links.mjs --release
