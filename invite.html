<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bondfires Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141416;
      color: #E4E2DD;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1E1E22;
      border: 1px solid #2E2E34;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #FF6B35;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 30px;
      font-weight: 900;
      color: #fff;
    }
    h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
    p { font-size: 15px; color: #9E9E9E; line-height: 1.5; margin-bottom: 24px; }
    .code {
      background: #2E2E34;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .code-label {
      font-size: 11px;
      color: #9E9E9E;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .code-value {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }
    .note {
      font-size: 12px;
      color: #9E9E9E;
      margin-bottom: 24px;
    }
    .open-app-button {
      display: block;
      background: #FF6B35;
      color: #fff;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .open-app-button:hover { background: #E55D2B; }
    .app-store-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .app-store-button {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #2E2E34;
      color: #fff;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      min-width: 132px;
    }
    .app-store-button:hover { background: #3A3A42; }
    .app-store-button svg { width: 18px; height: 18px; flex-shrink: 0; }
    [hidden] { display: none !important; }
  </style>
  <script>
    const appStoreUrl = 'https://apps.apple.com/us/app/bondfires/id6755933598';
    const playStoreBaseUrl = 'https://play.google.com/store/apps/details?id=org.bondfires';

    function getInviteCode() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts[0] !== 'invite') return null;
      if (pathParts[1] === 'camp') return pathParts[2] || null;
      return pathParts[1] || null;
    }

    function getDisplayCode(code) {
      try {
        return decodeURIComponent(code);
      } catch {
        return code;
      }
    }

    function getPlayStoreUrl(code) {
      const referrer = encodeURIComponent('invite=' + getDisplayCode(code));
      return playStoreBaseUrl + '&referrer=' + referrer;
    }

    async function copyInviteCode(code) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(getDisplayCode(code));
        }
      } catch {
        // Clipboard is best-effort; the code stays visible on the page.
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const code = getInviteCode();
      const isAndroid = /Android/i.test(window.navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(window.navigator.userAgent);

      const codeBox = document.getElementById('invite-code-box');
      const openAppLink = document.getElementById('open-app-link');
      const appStoreLink = document.getElementById('app-store-link');
      const playStoreLink = document.getElementById('play-store-link');
      const note = document.getElementById('invite-note');

      if (isAndroid && appStoreLink) appStoreLink.hidden = true;
      if (isIOS && playStoreLink) playStoreLink.hidden = true;
      if (note && !isIOS) note.hidden = true;

      if (!code) {
        if (codeBox) codeBox.hidden = true;
        if (note) note.hidden = true;
        if (openAppLink) openAppLink.hidden = true;
        return;
      }

      const encodedCode = encodeURIComponent(code);
      const appSchemeUrl = 'bondfires://invite/' + encodedCode;
      const playStoreUrl = getPlayStoreUrl(code);
      const intentUrl = 'intent://bondfires.app/invite/' + encodedCode + '#Intent;scheme=https;package=org.bondfires;S.browser_fallback_url=' + encodeURIComponent(playStoreUrl) + ';end;';

      document.getElementById('invite-code').textContent = getDisplayCode(code);

      if (openAppLink) openAppLink.href = isAndroid ? intentUrl : appSchemeUrl;
      if (appStoreLink) {
        appStoreLink.href = appStoreUrl;
        appStoreLink.addEventListener('click', function() {
          copyInviteCode(code);
        });
      }
      if (playStoreLink) playStoreLink.href = playStoreUrl;
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">B</div>
    <h1>You're invited to Bondfires.</h1>
    <p>Download the app to join.</p>
    <div class="code" id="invite-code-box">
      <div class="code-label">Invite Code</div>
      <div class="code-value" id="invite-code">...</div>
    </div>
    <p id="invite-note" class="note">We'll remember your invite code when you install the app.</p>
    <a id="open-app-link" class="open-app-button" href="bondfires://invite/">Open App</a>
    <div class="app-store-buttons">
      <a id="app-store-link" class="app-store-button" href="https://apps.apple.com/us/app/bondfires/id6755933598">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.701" /></svg>
        App Store
      </a>
      <a id="play-store-link" class="app-store-button" href="https://play.google.com/store/apps/details?id=org.bondfires">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z" /></svg>
        Play Store
      </a>
    </div>
  </div>
</body>
</html>
